apiVersion: apps/v1
kind: Deployment
metadata:
  name: food-ordering-portal
spec:
  replicas: 3
  selector:
    matchLabels:
      app: food-ordering-portal
      version: blue
  template:
    metadata:
      labels:
        app: food-ordering-portal
        version: blue
    spec:
      containers:
        - name: food-ordering-portal
          image: abdulkalamay/online-food-ordering-portal:v1.0.0
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: food-ordering-service
spec:
  type: NodePort
  selector:
    app: food-ordering-portal
    version: blue
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30015
